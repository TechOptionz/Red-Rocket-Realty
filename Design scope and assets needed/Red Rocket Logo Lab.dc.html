<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2a2d34;font-family:'Red Hat Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#d5273a}a:hover{color:#b81e2f}</style>
</helmet>
<div style="padding:40px;display:grid;gap:40px;color:#fff">
  <h1 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em">Logo lab · three new marks, each with the rocket</h1>

  <div style="display:grid;gap:12px"><div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#c9ccd3">A · Rocket tile</div>
    <div style="display:flex;gap:40px;flex-wrap:wrap">
      <div style="background:#16181d;padding:30px"><div id="a-dark" style="display:flex;align-items:center;gap:22px;width:max-content">
        <div style="width:92px;height:92px;border-radius:22px;background:#d5273a;display:grid;place-items:center;overflow:hidden"><img src="brand/logo3-emblem-white.png" alt="" style="width:64px;height:64px;object-fit:contain;display:block;transform:translate(2px,-1px)"></div>
        <div style="display:grid;gap:8px"><div style="font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:.9;color:#fff">RED ROCKET</div><div style="font-size:19px;font-weight:700;letter-spacing:.42em;line-height:1;color:#fff;padding-left:3px">REALTY</div></div>
      </div></div>
      <div style="background:#f4f5f6;padding:30px"><div id="a-light" style="display:flex;align-items:center;gap:22px;width:max-content">
        <div style="width:92px;height:92px;border-radius:22px;background:#d5273a;display:grid;place-items:center;overflow:hidden"><img src="brand/logo3-emblem-white.png" alt="" style="width:64px;height:64px;object-fit:contain;display:block;transform:translate(2px,-1px)"></div>
        <div style="display:grid;gap:8px"><div style="font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:.9;color:#111318">RED ROCKET</div><div style="font-size:19px;font-weight:700;letter-spacing:.42em;line-height:1;color:#111318;padding-left:3px">REALTY</div></div>
      </div></div>
    </div></div>

  <div style="display:grid;gap:12px"><div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#c9ccd3">B · Launch ring</div>
    <div style="display:flex;gap:40px;flex-wrap:wrap">
      <div style="background:#16181d;padding:30px"><div id="b-dark" style="display:flex;align-items:center;gap:22px;width:max-content">
        <div style="position:relative;width:96px;height:96px;border-radius:50%;border:4px solid #d5273a;display:grid;place-items:center;box-sizing:border-box"><span style="position:absolute;left:50%;bottom:-4px;width:30px;height:4px;background:#16181d;transform:translateX(-50%)"></span><img src="brand/logo3-emblem-dark.png?v=4" alt="" style="width:66px;height:66px;object-fit:contain;display:block;transform:translate(1px,2px)"></div>
        <div style="display:grid;gap:8px"><div style="font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:.9;color:#fff">RED ROCKET</div><div style="display:flex;align-items:center;gap:12px"><span style="height:3px;width:34px;background:#d5273a;display:block"></span><div style="font-size:19px;font-weight:700;letter-spacing:.42em;line-height:1;color:#fff">REALTY</div></div></div>
      </div></div>
      <div style="background:#f4f5f6;padding:30px"><div id="b-light" style="display:flex;align-items:center;gap:22px;width:max-content">
        <div style="position:relative;width:96px;height:96px;border-radius:50%;border:4px solid #d5273a;display:grid;place-items:center;box-sizing:border-box"><span style="position:absolute;left:50%;bottom:-4px;width:30px;height:4px;background:#f4f5f6;transform:translateX(-50%)"></span><img src="brand/logo3-emblem-dark.png?v=4" alt="" style="width:66px;height:66px;object-fit:contain;display:block;transform:translate(1px,2px)"></div>
        <div style="display:grid;gap:8px"><div style="font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:.9;color:#111318">RED ROCKET</div><div style="display:flex;align-items:center;gap:12px"><span style="height:3px;width:34px;background:#d5273a;display:block"></span><div style="font-size:19px;font-weight:700;letter-spacing:.42em;line-height:1;color:#111318">REALTY</div></div></div>
      </div></div>
    </div></div>

  <div style="display:grid;gap:12px"><div style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#c9ccd3">C · Wordmark with lift-off</div>
    <div style="display:flex;gap:40px;flex-wrap:wrap">
      <div style="background:#16181d;padding:30px"><div id="c-dark" style="display:grid;gap:10px;width:max-content">
        <div style="display:flex;align-items:flex-end;gap:10px;font-size:54px;font-weight:900;letter-spacing:-.04em;line-height:.9;color:#fff">RED ROCKET<img src="brand/logo3-emblem-dark.png?v=4" alt="" style="width:52px;height:52px;object-fit:contain;display:block;transform:translateY(4px)"></div>
        <div style="display:flex;align-items:center;gap:16px"><span style="height:2px;flex:1;background:rgba(255,255,255,.35);display:block"></span><div style="font-size:18px;font-weight:700;letter-spacing:.5em;line-height:1;color:#fff;padding-left:.5em">REALTY</div><span style="height:2px;flex:1;background:rgba(255,255,255,.35);display:block"></span></div>
      </div></div>
      <div style="background:#f4f5f6;padding:30px"><div id="c-light" style="display:grid;gap:10px;width:max-content">
        <div style="display:flex;align-items:flex-end;gap:10px;font-size:54px;font-weight:900;letter-spacing:-.04em;line-height:.9;color:#111318">RED ROCKET<img src="brand/logo3-emblem-dark.png?v=4" alt="" style="width:52px;height:52px;object-fit:contain;display:block;transform:translateY(4px)"></div>
        <div style="display:flex;align-items:center;gap:16px"><span style="height:2px;flex:1;background:rgba(17,19,24,.3);display:block"></span><div style="font-size:18px;font-weight:700;letter-spacing:.5em;line-height:1;color:#111318;padding-left:.5em">REALTY</div><span style="height:2px;flex:1;background:rgba(17,19,24,.3);display:block"></span></div>
      </div></div>
    </div></div>
</div>
</x-dc>
</body>
</html>
